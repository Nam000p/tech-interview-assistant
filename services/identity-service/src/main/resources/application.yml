server:
  port: 8081

spring:
  application:
    name: identity-service
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5433/interview_db?currentSchema=identity_schema
    username: namdx
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_schema: identity_schema

  flyway:
    enabled: true
    create-schemas: true
    schemas: identity_schema
    default-schema: identity_schema
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6337

  session:
    store-type: redis
    timeout: 3600s
    redis:
      flush-mode: on_save
      namespace: "interview:session"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/