server:
  port: 8081
  servlet:
    session:
      cookie:
        name: IDENTITY_SESSION

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5433/interview_db
    username: namdx
    password: password123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: identity_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    create-schemas: true
    schemas: identity_schema
    default-schema: identity_schema
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6337
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8

  session:
    store-type: redis
    timeout: 3600s
    redis:
      flush-mode: on_save
      namespace: "interview:session"
      save-mode: always

  graphql:
    graphiql:
      enabled: true
    schema:
      introspection:
        enabled: true
      locations: "classpath:graphql/"

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    health-check-url-path: /actuator/health

logging:
  level:
    org.springframework.security: INFO
    org.springframework.graphql: INFO
    com.namdx.identity: DEBUG